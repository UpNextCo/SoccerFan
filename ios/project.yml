name: BallKnowledge
options:
  bundleIdPrefix: com.psounds
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: 6.0.0

targets:
  BallKnowledge:
    type: application
    platform: iOS
    dependencies:
      - package: RiveRuntime
        product: RiveRuntime
    sources:
      - path: BallKnowledge
        excludes:
          - Resources/banner.png
          - Resources/banner1.png
          - Resources/bingo.PNG
          - Resources/tenaball.png
          - Resources/GameTiles
      - path: BallKnowledge/Resources/GameTiles
        type: folder
        buildPhase: resources
      - path: BallKnowledge/Resources/Rive
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psounds.ballknowledge
        INFOPLIST_KEY_CFBundleDisplayName: Ball Knowledge
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: BallKnowledge/BallKnowledge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: BallKnowledge/BallKnowledge.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

schemes:
  BallKnowledge:
    build:
      targets:
        BallKnowledge: all
    run:
      config: Debug
