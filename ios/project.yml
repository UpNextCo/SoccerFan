name: BallKnowledge
options:
  bundleIdPrefix: com.psounds
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  PhosphorSwift:
    url: https://github.com/phosphor-icons/swift
    from: 2.1.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

targets:
  BallKnowledge:
    type: application
    platform: iOS
    sources:
      - path: BallKnowledge
        excludes:
          - Resources/*.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psounds.ballknowledge
        INFOPLIST_KEY_CFBundleDisplayName: Ball Knowledge
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: BallKnowledge/BallKnowledge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: BallKnowledge/BallKnowledge.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: PhosphorSwift
        product: PhosphorSwift

schemes:
  BallKnowledge:
    build:
      targets:
        BallKnowledge: all
    run:
      config: Debug
